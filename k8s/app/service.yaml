apiVersion: v1
kind: Service
metadata:
  name: training-service
  namespace: training
  labels:
    app: training-service
spec:
  # Internal-only: identity headers are trusted only after API Gateway validation.
  type: ClusterIP
  selector:
    app: training-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
